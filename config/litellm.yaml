# Example LiteLLM proxy config: profiles -> vLLM backends
# Replace <...> with your model IDs and hosts.

model_list:
  - model_name: chat.fast
    litellm_params:
      model: openai/<multimodal-instruct-model>
      api_base: http://gpu-host:8000/v1
      api_key: "not-used"

  - model_name: chat.vision          # same deployment as chat.fast
    litellm_params:
      model: openai/<multimodal-instruct-model>
      api_base: http://gpu-host:8000/v1
      api_key: "not-used"

  - model_name: embed.text.v1        # version pinned; changing it = re-embed everything
    litellm_params:
      model: openai/<embedding-model>
      api_base: http://gpu-host:8001/v1
      api_key: "not-used"

  - model_name: compose.natural      # language-tuned model for smaller languages
    litellm_params:
      model: openai/<language-tuned-model>
      api_base: http://gpu-host:8002/v1
      api_key: "not-used"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # never in the file
